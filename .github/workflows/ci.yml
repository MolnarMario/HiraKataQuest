name: CI

# Build the debug APK and run the JVM unit tests on every push/PR to main.
# The Gradle wrapper JAR is intentionally not committed, so we provision a
# standalone Gradle 8.7 (matching gradle/wrapper/gradle-wrapper.properties)
# via gradle/actions/setup-gradle instead of ./gradlew.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug + run unit tests
        run: gradle assembleDebug testDebugUnitTest --console=plain --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
